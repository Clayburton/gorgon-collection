<!-- CKDesign — The Eleusinian Mysteries · WordPress Custom HTML block.
     Paste this WHOLE file into one Custom HTML block, BELOW the other collection
     blocks on /design/. The iframe grows to fit the collection column on phones
     (the page posts its height up as ckdCol — a distinct key so the collection
     iframes never resize each other).

     LOWER collection block: keeps loading="lazy" so it doesn't even start
     downloading until the visitor scrolls near it — the top block gets the
     whole connection first. Every collection block below the first is lazy. -->
<style>
  #ckd-eleusis{ width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw); }
  /* a little shorter than full-screen — this room is just 3 pieces in a row,
     so a tighter band reads more premium than a tall empty stage */
  #ckd-eleusis iframe{ display:block; width:100%; height:78svh; height:78dvh; border:0; }
</style>
<div id="ckd-eleusis">
  <iframe id="ckd-eleusis-frame"
          src="https://clayburton.github.io/gorgon-collection/eleusis/"
          title="The Eleusinian Mysteries — CKDesign"
          loading="lazy"
          allow="fullscreen"></iframe>
</div>
<script>
  (function () {
    var frame = document.getElementById('ckd-eleusis-frame');
    // FULL-BLEED, SCROLLBAR-SAFE. CSS `width:100vw` INCLUDES the vertical
    // scrollbar, so on Windows (classic, non-overlay scrollbars) every block is
    // ~15px wider than the viewport — the page gains a horizontal scrollbar and
    // wheel scrolling feels wrong. documentElement.clientWidth EXCLUDES the
    // scrollbar, so measure and pull the block to the true left edge instead.
    var wrap = frame.parentNode;
    function fullBleed () {
      wrap.style.width = '';
      wrap.style.marginLeft = '';
      wrap.style.marginRight = '';
      var vw = document.documentElement.clientWidth || window.innerWidth || 0;
      // a hidden/background tab can measure 0 — never collapse the block to
      // nothing; just leave the CSS 100vw fallback in place and try again later
      if (vw < 200) return;
      var left = wrap.getBoundingClientRect().left;
      wrap.style.width = vw + 'px';
      wrap.style.marginLeft = (-left) + 'px';
      wrap.style.marginRight = '0px';
    }
    fullBleed();
    addEventListener('resize', fullBleed, { passive: true });
    addEventListener('load', fullBleed);

    addEventListener('message', function (e) {
      if (e.origin !== 'https://clayburton.github.io') return;
      var d = e.data || {};
      if (d.ckdCol === 'eleusis' && typeof d.h === 'number' && d.h > 200 && d.h < 12000) {
        frame.style.height = Math.round(d.h) + 'px';
      }
    });
  })();
</script>

<!-- ============================================================
     SHARED CKD FADE-TO-WHITE — paste this IDENTICAL block inside
     EVERY CKD Custom HTML block on the page. It installs once (guard
     below), listens for {ckd:'flash'} from any CKD iframe, and fades
     the WHOLE viewport white — so clicking an object in one block
     fades every other block (and any peeking sliver) with it.
     The pageshow reset is REQUIRED: the browser's back button restores
     this page from cache exactly as it was left — overlay still white —
     so without the reset the page comes back as a stuck white sheet.
     Pure CSS opacity, GPU-composited, zero JS per frame — no lag.
     ============================================================ -->
<script>
  (function () {
    if (window.__ckdFlash) return;              // install once per page
    window.__ckdFlash = true;
    var ov = document.createElement('div');
    ov.setAttribute('aria-hidden', 'true');
    ov.style.cssText =
      'position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;' +
      'z-index:2147483647;transition:opacity .32s ease;';
    (document.body || document.documentElement).appendChild(ov);
    function clearOv () {
      ov.style.transition = 'none';             // snap clear — no fade on the way back
      ov.style.opacity = '0';
      ov.style.pointerEvents = 'none';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { ov.style.transition = 'opacity .32s ease'; });
      });
    }
    addEventListener('message', function (e) {
      if (e.origin !== 'https://clayburton.github.io') return;
      if (e.data && e.data.ckd === 'flash') {
        ov.style.pointerEvents = 'auto';
        ov.style.opacity = '1';
      }
    });
    // back/forward restores the page WITH the overlay still white — always clear it
    addEventListener('pageshow', clearOv);
    // safety valve: if the overlay is ever stuck, a click/tap dismisses it
    ov.addEventListener('click', clearOv);

    // Keep the page at the TOP while the collection blocks grow during load —
    // on phones the growing iframes otherwise leave the page scrolled
    // mid-collection.
    //
    // THE TRAP (fixed 2026-08-07): the collection iframes are a full viewport
    // tall, so the visitor's pointer sits over a CROSS-ORIGIN iframe — and
    // wheel/pointerdown/touchstart over one NEVER reach this window. The old
    // disarm list therefore could not fire, while Chrome still chained the
    // scroll through to this page. Every height message then yanked the reader
    // back to the top mid-scroll. Reported on Chrome/Windows ("scrolling gets
    // stuck, I had to grab the scrollbar") and reproduced locally.
    // The fix: the rooms now post {ckd:'userinput'} on first interaction, which
    // is the only signal that survives the origin boundary. Window shortened to
    // 2.5s so even a total failure to disarm can't spoil a real read.
    var moved = false, t0 = Date.now(), selfScrollAt = 0;
    function disarm () { moved = true; }
    ['touchstart', 'wheel', 'keydown', 'pointerdown'].forEach(function (ev) {
      addEventListener(ev, disarm, { once: true, passive: true });
    });
    // ANY scroll we did not cause ourselves means the visitor is driving. This is
    // what catches a scrollbar drag — the exact workaround the visitor who
    // reported this had to resort to — and it needs no cooperation from the
    // iframe. Content growing below the fold does not move scrollY, so this does
    // not disarm the guard in the case it actually exists for.
    addEventListener('scroll', function () {
      if (Date.now() - selfScrollAt > 300) disarm();
    }, { passive: true });
    // Bound the blast radius: only ever correct a SMALL offset. Layout growth
    // nudges the page by a little; a reader who is 400px+ down is deliberately
    // reading and must never be yanked, whatever else fails to disarm.
    function pinTop () {
      if (moved || Date.now() - t0 > 2500) return;
      if (scrollY <= 0 || scrollY > 400) return;
      selfScrollAt = Date.now();
      scrollTo(0, 0);
    }
    addEventListener('message', function (e) {
      if (e.origin !== 'https://clayburton.github.io') return;
      var d = e.data || {};
      if (d.ckd === 'userinput') { disarm(); return; }   // interaction inside a room
      if (d.ckd === 'height' || d.ckdCol) setTimeout(pinTop, 60);
    });
    addEventListener('load', function () { setTimeout(pinTop, 120); });
  })();
</script>
